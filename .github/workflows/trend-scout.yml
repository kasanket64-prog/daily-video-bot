name: Scout trends for Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '37 0 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: short-trend-scout
  cancel-in-progress: false

jobs:
  scout:
    if: github.event_name == 'workflow_dispatch' || vars.TREND_SCOUT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect current chart as discovery context
        env:
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          python trend_scout.py --cloud-catalog "$RUNNER_TEMP/reviewed-sources.json" > trend-snapshot.json
      - name: Select a fresh candidate with reviewed footage
        env:
          SHORT_DRAFT_HISTORY: ${{ vars.SHORT_DRAFT_HISTORY }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          SHORT_TELEGRAM_ENABLED: ${{ vars.SHORT_TELEGRAM_ENABLED }}
        run: |
          if [[ "$(cat "$RUNNER_TEMP/reviewed-sources.json")" == '[]' ]]; then
            echo "No reviewed footage catalog configured. Keeping discovery results only."
            exit 0
          fi
          printf '%s' "${SHORT_DRAFT_HISTORY:-[]}" > "$RUNNER_TEMP/short-history.json"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          delivery=()
          if [[ "$SHORT_TELEGRAM_ENABLED" == true ]]; then
            delivery+=(--deliver)
          fi
          python short_candidates.py trend-snapshot.json "$RUNNER_TEMP/reviewed-sources.json" \
            "$RUNNER_TEMP/short-history.json" --summary \
            --render-dir "$RUNNER_TEMP/short-draft" "${delivery[@]}" > short-selection.json
      - name: Look for open footage when no reviewed clip was selected
        run: |
          if [[ ! -f short-selection.json || "$(cat short-selection.json)" == 'null' ]]; then
            python footage_scout.py --snapshot trend-snapshot.json > footage-leads.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: trend-snapshot
          path: |
            trend-snapshot.json
            short-selection.json
            footage-leads.json
          retention-days: 7
