name: Scout trends for Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '37 0 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: short-trend-scout
  cancel-in-progress: false

jobs:
  scout:
    if: github.event_name == 'workflow_dispatch' || vars.TREND_SCOUT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .trend-state
          key: trend-scout-in-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trend-scout-in-v1-
      - name: Collect current chart and measure view growth
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          mkdir -p .trend-state
          args=(--region IN)
          if [[ -f .trend-state/snapshot.json ]]; then
            args+=(--previous .trend-state/snapshot.json)
          fi
          python trend_scout.py "${args[@]}" > trend-snapshot.json
          cp trend-snapshot.json .trend-state/snapshot.json
      - uses: actions/cache/save@v4
        with:
          path: .trend-state
          key: trend-scout-in-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Select a fresh candidate with reviewed footage
        env:
          REVIEWED_SHORT_SOURCES: ${{ secrets.REVIEWED_SHORT_SOURCES }}
          SHORT_DRAFT_HISTORY: ${{ vars.SHORT_DRAFT_HISTORY }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          SHORT_TELEGRAM_ENABLED: ${{ vars.SHORT_TELEGRAM_ENABLED }}
        run: |
          if [[ -z "$REVIEWED_SHORT_SOURCES" ]]; then
            echo "No reviewed footage catalog configured. Keeping discovery results only."
            exit 0
          fi
          printf '%s' "$REVIEWED_SHORT_SOURCES" > "$RUNNER_TEMP/reviewed-sources.json"
          printf '%s' "${SHORT_DRAFT_HISTORY:-[]}" > "$RUNNER_TEMP/short-history.json"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          delivery=()
          if [[ "$SHORT_TELEGRAM_ENABLED" == true ]]; then
            delivery+=(--deliver)
          fi
          python short_candidates.py trend-snapshot.json "$RUNNER_TEMP/reviewed-sources.json" \
            "$RUNNER_TEMP/short-history.json" --summary \
            --render-dir "$RUNNER_TEMP/short-draft" "${delivery[@]}" > short-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: trend-snapshot
          path: |
            trend-snapshot.json
            short-selection.json
          retention-days: 7
