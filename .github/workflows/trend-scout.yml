name: Scout trends for Shorts

on:
  workflow_dispatch:
    inputs:
      watch_live:
        description: Watch a reviewed live GTA feed
        type: boolean
        default: false
  schedule:
    - cron: '37 0 * * *'
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: short-trend-scout
  cancel-in-progress: false

jobs:
  scout:
    if: >-
      (vars.GTA_REELS_ENABLED != 'true' || github.event.repository.private == false) &&
      (github.event_name == 'workflow_dispatch' || vars.TREND_SCOUT_ENABLED == 'true' || vars.GTA_REELS_ENABLED == 'true') &&
      ((github.event.schedule != '3,18,33,48 * * * *' && !inputs.watch_live) ||
       (vars.GTA_REELS_ENABLED == 'true' && (inputs.watch_live || vars.GTA_LIVE_WATCH_ENABLED == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      GTA_REELS_ENABLED: ${{ vars.GTA_REELS_ENABLED }}
      GTA_LIVE_RUN: ${{ (github.event.schedule == '3,18,33,48 * * * *' || inputs.watch_live) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect current chart as discovery context
        env:
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          python trend_scout.py --cloud-catalog "$RUNNER_TEMP/reviewed-sources.json" > trend-snapshot.json
      - name: Select a fresh candidate with reviewed footage
        env:
          SHORT_DRAFT_HISTORY: ${{ vars.SHORT_DRAFT_HISTORY }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          SHORT_TELEGRAM_ENABLED: ${{ vars.SHORT_TELEGRAM_ENABLED }}
        run: |
          if [[ "$(cat "$RUNNER_TEMP/reviewed-sources.json")" == '[]' ]]; then
            echo "No reviewed footage catalog configured. Keeping discovery results only."
            exit 0
          fi
          if [[ "$GTA_LIVE_RUN" == true ]] && ! jq -e --slurpfile catalog "$RUNNER_TEMP/reviewed-sources.json" '
            [.videos[] | select(.live_started_at) | .source_id] as $live |
            any($catalog[0][]; .media_kind == "live-hls" and (.source_id as $id | $live | index($id) != null))' trend-snapshot.json >/dev/null; then
            echo "No reviewed live broadcast is on air."
            exit 0
          fi
          printf '%s' "${SHORT_DRAFT_HISTORY:-[]}" > "$RUNNER_TEMP/short-history.json"
          delivery=()
          if [[ "$SHORT_TELEGRAM_ENABLED" == true || "$GTA_REELS_ENABLED" == true ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
            delivery+=(--deliver --render-dir "$RUNNER_TEMP/short-draft")
          fi
          if [[ "$GTA_REELS_ENABLED" == true ]]; then
            python -m pip install faster-whisper==1.2.1
            python gta_batch.py trend-snapshot.json "$RUNNER_TEMP/reviewed-sources.json" "$RUNNER_TEMP/short-draft" > short-selection.json
            exit 0
          fi
          python short_candidates.py trend-snapshot.json "$RUNNER_TEMP/reviewed-sources.json" \
            "$RUNNER_TEMP/short-history.json" --summary \
            "${delivery[@]}" > short-selection.json
      - name: Look for open footage when no reviewed clip was selected
        if: vars.GTA_REELS_ENABLED != 'true'
        run: |
          if [[ ! -f short-selection.json ]] || jq -e '.selected == null' short-selection.json >/dev/null; then
            python footage_scout.py --snapshot trend-snapshot.json > footage-leads.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: trend-snapshot
          path: |
            trend-snapshot.json
            short-selection.json
            footage-leads.json
          retention-days: 7
