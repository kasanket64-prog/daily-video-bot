name: Generate daily preview
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-video-bot-state
  cancel-in-progress: false
jobs:
  generate:
    if: vars.AUTOMATION_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check free services are configured
        run: |
          python -c "import os; assert all(os.environ.get(k) for k in ['GEMINI_API_KEY','PEXELS_API_KEY','TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID']), 'Required secrets are missing'"
          python -m unittest discover -s tests -v
      - name: Install video tools and pinned MoneyPrinterTurbo source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          git clone --filter=blob:none https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          git -C mpt checkout ab6004e5858998b2ce99ac46c0f16675eea9ab6f
          python -m pip install uv==0.12.12
          uv pip install --system --overrides mpt/requirements-security.txt -r mpt/requirements.txt
      - name: Generate without publishing
        id: generate
        run: python bot.py generate
      - name: Store exact preview for approval (expires after two days)
        if: steps.generate.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            out/video.mp4
            out/metadata.json
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Register preview
        if: steps.generate.outputs.generated == 'true'
        run: python bot.py register
