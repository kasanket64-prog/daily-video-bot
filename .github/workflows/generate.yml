name: Generate daily preview
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: daily-cloud-render
  cancel-in-progress: false
jobs:
  generate:
    if: vars.AUTOMATION_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify configuration and tests
        run: |
          python -c "from cloud_render import worker_url; worker_url()"
          python -m unittest discover -s tests -v
      - name: Check cloud connection before installing video tools
        run: |
          python -u - <<'PY'
          from cloud_render import identity, worker_url
          from bot import APIError, http
          import base64, json, time
          worker = worker_url()
          try:
              print('Checking Worker health')
              http('GET', worker + '/health')
              print('Checking GitHub workload identity')
              token = identity(worker)
              part = token.split('.')[1]
              claims = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
              expected = {'iss': 'https://token.actions.githubusercontent.com', 'aud': worker,
                  'sub': 'repo:kasanket64-prog/daily-video-bot:ref:refs/heads/main',
                  'repository': 'kasanket64-prog/daily-video-bot', 'repository_id': '1444540860',
                  'repository_owner_id': '232636360', 'ref': 'refs/heads/main',
                  'workflow_ref': 'kasanket64-prog/daily-video-bot/.github/workflows/generate.yml@refs/heads/main',
                  'event_name': 'workflow_dispatch'}
              print('Identity claim checks:', {key: claims.get(key) == value for key, value in expected.items()})
              print('Identity time checks:', {'not_expired': claims.get('exp', 0) > time.time(),
                  'recent': time.time() - 600 <= claims.get('iat', 0) <= time.time() + 30})
              print('Checking Worker renderer authorization')
              http('POST', worker + '/render/job', headers={'Authorization': 'Bearer ' + token}, data={})
              print('Cloud connection accepted')
          except APIError as error:
              print(str(error))
              raise SystemExit(1)
          PY
      - name: Install video tools and pinned MoneyPrinterTurbo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          git clone --filter=blob:none https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          git -C mpt checkout ab6004e5858998b2ce99ac46c0f16675eea9ab6f
          python -m pip install uv==0.12.12
          uv pip install --system --overrides mpt/requirements-security.txt -r mpt/requirements.txt
      - name: Render and send preview using workload identity
        run: python cloud_render.py
