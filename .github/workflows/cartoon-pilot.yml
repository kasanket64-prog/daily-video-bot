name: Render original cartoon episode and Short
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartoon-style-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core
          python -m pip install -r requirements-cartoon.txt
      - name: Render the sample story as a YouTube episode and vertical Short
        run: python -u cartoon_pilot.py --story-json examples/cartoon-story.json --output cartoon-output
      - name: Save both exports for review
        uses: actions/upload-artifact@v4
        with:
          name: milo-and-pip-episode-review
          path: cartoon-output/
          retention-days: 3
