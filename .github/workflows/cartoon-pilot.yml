name: Render original cartoon pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartoon-style-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r requirements-cartoon.txt
      - name: Render one story in both formats
        run: python -u cartoon_pilot.py --output pilot-output
      - name: Check the actual exports
        run: python cartoon_selfcheck.py pilot-output
      - name: Save pilot for review
        uses: actions/upload-artifact@v4
        with:
          name: milo-and-pip-style-pilot
          path: pilot-output/
          retention-days: 3
