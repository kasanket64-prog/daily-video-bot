name: Render original cartoon episode and Short
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cartoon-style-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: vars.CARTOON_AUTOMATION_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          python -m pip install -r requirements-cartoon.txt
      - name: Prepare today's story and owner-review jobs
        id: prepare_story
        run: python cartoon_cloud.py prepare
      - name: Render today's story as a YouTube episode and vertical Short
        id: render_episode
        run: python -u cartoon_pilot.py --story-json work/cartoon-story.json --output cartoon-output
      - name: Inspect and send both previews to private Telegram
        id: deliver_previews
        run: python cartoon_cloud.py deliver
      - name: Notify Telegram if the daily cartoon run failed
        if: failure() && (steps.prepare_story.outcome == 'failure' || steps.render_episode.outcome == 'failure' || steps.deliver_previews.outcome == 'failure')
        run: python cartoon_cloud.py failed
      - name: Include the exact story in the review artifact
        run: cp work/cartoon-story.json cartoon-output/cartoon-story.json
      - name: Save both exports for review
        if: always() && hashFiles('cartoon-output/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: milo-and-pip-episode-review
          path: cartoon-output/
          retention-days: 3
